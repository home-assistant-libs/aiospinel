# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch", "dev"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "codespell"
name = "codespell"
entry = "uv run --frozen codespell --toml pyproject.toml"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run --frozen ruff check --force-exclude --fix"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run --frozen ruff format --force-exclude"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.11.16"

[[repos.hooks]]
id = "uv-lock"
args = ["--check"]

[[repos]]
repo = "https://github.com/google/yamlfmt"
rev = "v0.21.0"

[[repos.hooks]]
id = "yamlfmt"
args = ["-formatter", "retain_line_breaks=true"]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"

[[repos.hooks]]
id = "taplo-format"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "mypy"
name = "mypy"
entry = "uv run --frozen mypy"
language = "system"
types_or = ["python", "pyi"]
require_serial = true

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.24.1"

[[repos.hooks]]
id = "zizmor"
args = ["--pedantic"]
